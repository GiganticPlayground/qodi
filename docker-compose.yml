services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    develop:
      watch:
        - action: rebuild
          path: ./src
        - action: rebuild
          path: ./api
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./tsconfig.json
        - action: rebuild
          path: ./Dockerfile
    container_name: qodi
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=production
      - QODI_PORT=8080
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
